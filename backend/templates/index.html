<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MediPulse AI – Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#050505] text-gray-200 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md">
    <div class="text-center mb-10">
      <h1 class="text-4xl font-bold text-cyan-400 mb-2">🩺 Jaswanth AI</h1>
      <p class="text-gray-400">AI-powered symptom analysis</p>
    </div>
    <div class="bg-[#121212] border border-white/10 rounded-3xl p-8">
      <h2 class="text-xl font-bold mb-4">Login</h2>
      <input id="loginUser" placeholder="Username" class="w-full bg-black border border-white/10 rounded-xl py-3 px-4 mb-3" />
      <input id="loginPass" type="password" placeholder="Password" class="w-full bg-black border border-white/10 rounded-xl py-3 px-4 mb-4" />
      <button onclick="login()" class="w-full py-3 bg-cyan-500 text-black rounded-xl font-bold mb-4">Login</button>
      <button onclick="window.location.href='/register'" class="w-full py-3 bg-white/10 hover:bg-white/20 rounded-xl font-bold">Create New Account</button>
    </div>
    <p class="text-center text-gray-500 text-sm mt-6">This system provides probabilistic insights and is not a medical diagnosis.</p>
  </div>
<script>
async function login() {
  const res = await fetch('/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: loginUser.value, password: loginPass.value})
  });
  if (res.ok) window.location.href = '/dashboard';
  else alert('Invalid login credentials');
}
</script>
</body>
</html>
