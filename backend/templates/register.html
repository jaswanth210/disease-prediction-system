<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MediPulse AI – Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#050505] text-gray-200 min-h-screen flex items-center justify-center">
  <form action="/register" method="POST" enctype="multipart/form-data" class="bg-[#121212] border border-white/10 rounded-3xl p-8 w-full max-w-md">
    <h2 class="text-xl font-bold mb-4">Register</h2>
    <input name="name" placeholder="Full Name" class="w-full bg-black border border-white/10 rounded-xl py-3 px-4 mb-3" required />
    <input name="username" placeholder="Username" class="w-full bg-black border border-white/10 rounded-xl py-3 px-4 mb-3" required />
    <input type="email" name="email" placeholder="Email Address" class="w-full bg-black border border-white/10 rounded-xl py-3 px-4 mb-3" required />
    <input name="phone" placeholder="Phone Number" class="w-full bg-black border border-white/10 rounded-xl py-3 px-4 mb-3" required />
    <input type="password" name="password" placeholder="Password" class="w-full bg-black border border-white/10 rounded-xl py-3 px-4 mb-3" required />
    <label class="block text-sm text-gray-400 mb-2">Profile Image</label>
    <input type="file" name="image" accept="image/*" class="w-full text-sm bg-black border border-white/10 rounded-xl py-2 px-3 mb-4" />
    <button class="w-full py-3 bg-cyan-500 text-black rounded-xl font-bold">Register</button>
  </form>
</body>
</html>
